  <!-- Gradientes -->
  <defs>
    <linearGradient id="grad1" x1="70" y1="90" x2="190" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2FB9"/>
      <stop offset="1" stop-color="#A900FF"/>
    </linearGradient>
    <linearGradient id="grad2" x1="230" y1="90" x2="110" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A900FF"/>
      <stop offset="1" stop-color="#FF2FB9"/>
    </linearGradient>
  </defs>

  <!-- Texto principal -->
  <text x="50%" y="275" fill="white" font-size="28" font-family="Poppins, sans-serif" text-anchor="middle" font-weight="700" letter-spacing="2">
    gustavocodes
  </text>
</svg>
