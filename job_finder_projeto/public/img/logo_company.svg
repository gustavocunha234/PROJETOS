<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo -->
  <rect width="300" height="300" fill="#0D0F19"/>

  <!-- Forma Esquerda -->
  <path d="M110 90 L70 150 L110 210 C125 230 160 230 145 210 L110 150 L145 90 C160 70 125 70 110 90Z"
